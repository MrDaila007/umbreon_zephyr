name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ZEPHYR_SDK_VERSION: "1.0.0"
  ZEPHYR_SDK_INSTALL_DIR: /opt/zephyr-sdk-1.0.0
  U8G2_REVISION: cbceaa1cab22ad63e41c2df684e173cd5433766e
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Host unit tests (gcc, no Zephyr)
  test-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run host unit tests
        working-directory: tests
        run: make test-host

  # UI overlap check (PIL simulator, no Zephyr required)
  check-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch u8g2 font sources
        uses: actions/checkout@v4
        with:
          repository: olikraus/u8g2
          ref: ${{ env.U8G2_REVISION }}
          path: modules/u8g2

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow

      - name: Check dashboard UI overlaps
        run: python3 tools/sim_dashboard.py

      - name: Upload simulator render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-dashboard
          path: tools/sim_dashboard.png

  # Firmware build (RP2350) on GitHub-hosted runner
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.29.0
    steps:
      - uses: actions/checkout@v4
        with:
          path: app

      - name: Cache Zephyr SDK
        uses: actions/cache@v4
        with:
          path: /opt/zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}
          key: sdk-${{ env.ZEPHYR_SDK_VERSION }}

      - name: Install Zephyr SDK
        run: |
          set -euo pipefail
          if [ ! -d "$ZEPHYR_SDK_INSTALL_DIR" ]; then
            wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${ZEPHYR_SDK_VERSION}/zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-x86_64_minimal.tar.xz"
            tar xf "zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-x86_64_minimal.tar.xz" -C /opt/
            rm -f "zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-x86_64_minimal.tar.xz"
            cd "$ZEPHYR_SDK_INSTALL_DIR"
            ./setup.sh -t arm-zephyr-eabi -c
          fi

      - name: Initialize west workspace
        run: |
          set -euo pipefail
          west init -l app
          west update --narrow -o=--depth=1
          python3 -m pip install -r zephyr/scripts/requirements.txt

      - name: Build firmware
        run: |
          set -euo pipefail
          west build -b rpi_pico2/rp2350a/m33 -d app/build --pristine always app

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: app/build/zephyr/zephyr.uf2

  # Zephyr ztest (native_sim)
  test-ztest:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.29.0
    steps:
      - uses: actions/checkout@v4
        with:
          path: app

      - name: Initialize west workspace
        run: |
          set -euo pipefail
          west init -l app
          west update --narrow -o=--depth=1
          python3 -m pip install -r zephyr/scripts/requirements.txt

      - name: Run ztest
        run: |
          set -euo pipefail
          west build -b native_sim -d app/build/ztest --pristine always app/tests/ztest
          app/build/ztest/zephyr/zephyr.exe
